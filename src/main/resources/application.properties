spring.application.name=payment-transaction-splitter

# Database configuration (Matches Docker setup in Phase 3)
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Modulith Event Publication Configuration
spring.modulith.events.jdbc.schema-initialization.enabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Application Custom Paths
app.processing.input-dir=./data/input
app.processing.output-dir=./data/output